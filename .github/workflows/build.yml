name: Build DARK ELITE SDK 2.0 D/Z/B

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build ELITE AARs (B/D/Z)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: wrapper

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build B CORE
        run: ./gradlew :dark-sdk:assembleBCoreRelease --no-daemon

      - name: Build D CORE (Elite Daemon)
        run: ./gradlew :dark-sdk:assembleDCoreRelease --no-daemon

      - name: Build Z CORE (Elite Zygote)
        run: ./gradlew :dark-sdk:assembleZCoreRelease --no-daemon

      - name: Build Debug
        run: ./gradlew :dark-sdk:assembleDebug --no-daemon

      - name: Upload B CORE AAR
        uses: actions/upload-artifact@v4
        with:
          name: dark-elite-bcore-release
          path: dark-sdk/build/outputs/aar/*bCore*.aar
          retention-days: 30

      - name: Upload D CORE AAR
        uses: actions/upload-artifact@v4
        with:
          name: dark-elite-dcore-release
          path: dark-sdk/build/outputs/aar/*dCore*.aar
          retention-days: 30

      - name: Upload Z CORE AAR
        uses: actions/upload-artifact@v4
        with:
          name: dark-elite-zcore-release
          path: dark-sdk/build/outputs/aar/*zCore*.aar
          retention-days: 30

      - name: Upload ELITE AAR
        uses: actions/upload-artifact@v4
        with:
          name: dark-elite-all
          path: dark-sdk/build/outputs/aar/*.aar
          retention-days: 30

  publish:
    name: Publish & Release 2.0-ELITE
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: wrapper
      - run: chmod +x gradlew
      - name: Publish to GitHub Packages
        run: ./gradlew :dark-sdk:publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release v2.0-ELITE
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.0-ELITE
          name: "DARK ELITE SDK 2.0 - D/Z/B CORE (Twitter/FB/Anogs/Mic Fix)"
          body: |
            ## DARK ELITE SDK 2.0
            - B CORE -> D CORE (Daemon) / Z CORE (Zygote) Elite
            - Twitter Login Fix (CustomTabs PKCE)
            - Facebook Login Fix (keyhash proxy)
            - Anogs Fix (maps/signal/signature)
            - Mic Glitch Fix (AudioRecord fallback + AEC)
            Built from Telegram/DARK-SDK
          files: dark-sdk/build/outputs/aar/*.aar
          generate_release_notes: true
